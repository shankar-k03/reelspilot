
name: ReelsPilot Daily Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelspilot-daily
  cancel-in-progress: false

jobs:
  reels-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start ReelsPilot
        run: echo "Cloud automation started"

      - name: Run Reel Queue Manager
        run: python scripts/queue_manager.py
