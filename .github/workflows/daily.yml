
name: ReelsPilot Daily Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelspilot-daily
  cancel-in-progress: false

jobs:
  reels-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile \
            cloud_uploader.py \
            cloud_cleanup.py \
            reel_validator.py \
            run_report.py \
            scripts/queue_manager.py

      - name: Run ReelsPilot Queue
        run: python scripts/queue_manager.py

      - name: Automation test completed
        run: echo "ReelsPilot cloud test completed"
