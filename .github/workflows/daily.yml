name: ReelsPilot Cloud Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  cloud-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          request = urllib.request.Request(
              url + "/storage/v1/bucket/reels-queue",
              headers={"apikey": key}
          )

          try:
              response = urllib.request.urlopen(request, timeout=30)
              print("Supabase connection successful!")
              print("Bucket reels-queue is accessible.")
              print("HTTP status:", response.status)
          except urllib.error.HTTPError as error:
              print("Supabase returned HTTP:", error.code)
              raise SystemExit("Connection test failed.")
          except Exception as error:
              print("Connection test failed:", type(error).__name__)
              raise SystemExit(1)
          PY
