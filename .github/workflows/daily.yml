
name: ReelsPilot Daily Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelspilot-daily
  cancel-in-progress: false

jobs:
  reels-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start ReelsPilot
        run: |
          echo "ReelsPilot cloud automation started"
          echo "Scheduled daily at 9:00 AM IST"

      - name: Check cloud connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          req = urllib.request.Request(
              f"{url}/storage/v1/bucket/reels-queue",
              headers={"apikey": key}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print("Cloud storage connected:", response.status)

          print("Automation infrastructure is ready.")
          PY
